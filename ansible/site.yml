# 20260729-1210_017
# @CST:add:update_7d3a_ansible_nginx:site
# Hantt practical - nginx with HTTPS (self-signed) on Amazon Linux 2023
---
- name: Configure nginx with HTTPS
  hosts: nginx_linux
  become: true
  vars:
    cert_dir: /etc/nginx/ssl
    cert_days: 365
    server_name: "{{ ansible_host }}"

  tasks:
    - name: Install nginx and openssl
      ansible.builtin.dnf:
        name:
          - nginx
          - openssl
        state: present

    - name: Create certificate directory
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate self-signed certificate (idempotent)
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -newkey rsa:2048
          -keyout {{ cert_dir }}/nginx.key
          -out {{ cert_dir }}/nginx.crt
          -days {{ cert_days }}
          -subj "/C=NZ/O=Hantt Practical/CN={{ server_name }}"
        creates: "{{ cert_dir }}/nginx.crt"

    - name: Deploy HTTPS site config
      ansible.builtin.template:
        src: templates/https.conf.j2
        dest: /etc/nginx/conf.d/https.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Deploy index page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: "0644"

    - name: Validate nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
